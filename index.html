<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนเลขพัสดุ iData K3S</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col select-none">

  <!-- ส่วนหัว (Header) ขนาดกะทัดรัด -->
  <header class="bg-blue-600 text-white px-3 py-2.5 shadow-md flex items-center justify-between gap-2 sticky top-0 z-40">
    <!-- ฝั่งซ้าย: ยอดรวม และชุดสวิตช์เปิด-ปิด -->
    <div class="flex items-center flex-wrap gap-2.5">
      <!-- ยอดรวม -->
      <div class="bg-blue-700/90 px-2.5 py-1.5 rounded-xl border border-blue-400/50 flex items-center space-x-1.5 shrink-0 shadow-inner">
        <span class="text-xs text-blue-200 font-medium">รวม</span>
        <span id="itemCount" class="font-extrabold text-base text-white">0</span>
      </div>

      <!-- สวิตช์ กันซ้ำ และ เสียง -->
      <div class="flex items-center space-x-2.5 bg-blue-700/60 px-2.5 py-1.5 rounded-xl border border-blue-500/40">
        <!-- สวิตช์ กันซ้ำ -->
        <label class="inline-flex items-center gap-1.5 cursor-pointer select-none leading-none">
          <span class="text-xs font-bold text-blue-50 leading-none">กันซ้ำ</span>
          <span class="relative inline-flex items-center h-4 w-8 shrink-0">
            <input type="checkbox" id="preventDuplicate" checked class="sr-only peer">
            <span class="w-8 h-4 bg-rose-500 rounded-full peer peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4 shadow-inner"></span>
          </span>
        </label>

        <div class="w-[1px] h-4 bg-blue-500/50"></div>

        <!-- สวิตช์ เสียง -->
        <label class="inline-flex items-center gap-1.5 cursor-pointer select-none leading-none">
          <span class="text-xs font-bold text-blue-50 leading-none">เสียง</span>
          <span class="relative inline-flex items-center h-4 w-8 shrink-0">
            <input type="checkbox" id="soundEnabled" checked class="sr-only peer">
            <span class="w-8 h-4 bg-rose-500 rounded-full peer peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4 shadow-inner"></span>
          </span>
        </label>
      </div>
    </div>

    <!-- ฝั่งขวา: หมายเหตุคำแนะนำชิดขวาสุดให้ลูกศรชี้ตรงปุ่มคีย์บอร์ดด้านล่าง -->
    <div class="flex items-center justify-end">
      <div class="flex items-center space-x-1.5 text-amber-100 font-semibold text-[11px] bg-blue-800/80 px-2.5 py-1.5 rounded-xl border border-blue-400/40 shadow-inner">
        <span class="leading-tight">สแกนแล้วไม่ขึ้นเลข? กดปุ่มตามลูกศรชี้ แล้วกดย้อนกลับ 1 ครั้งเพื่อซ่อนแป้นพิมพ์</span>
        <svg class="w-4 h-4 text-amber-300 shrink-0 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m0 0l-6-6m6 6l6-6"></path>
        </svg>
      </div>
    </div>
  </header>

  <!-- ส่วนควบคุมการสแกนและกรอกข้อมูล -->
  <div class="bg-white px-3 py-2.5 shadow-sm border-b border-slate-200 sticky top-[52px] z-30">
    <div class="relative flex items-center">
      <input 
        type="text" 
        id="barcodeInput" 
        inputmode="none"
        placeholder="กดปุ่มยิงบาร์โค้ด..." 
        class="w-full bg-slate-50 border-2 border-blue-400 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 rounded-xl pl-3 pr-24 py-3 text-base font-bold text-slate-800 placeholder-slate-400 outline-none transition"
        autocomplete="off"
      >
      <!-- สวิตช์เปิด/ปิดคีย์บอร์ด (ขนาดใหญ่เหมาะกับช่อง) -->
      <label class="absolute right-2 inline-flex items-center cursor-pointer select-none" title="เปิด/ปิดคีย์บอร์ด">
        <input type="checkbox" id="keyboardToggle" class="sr-only peer">
        <div class="w-16 h-9 bg-rose-500 rounded-full peer peer-checked:bg-emerald-500 transition-colors duration-200 shadow-inner relative flex items-center justify-between px-2">
          <!-- ไอคอนคีย์บอร์ดฝั่งซ้าย (แสดงตอนเปิด) -->
          <svg class="w-4 h-4 text-white opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
          </svg>
          <!-- ไอคอนปิดฝั่งขวา (แสดงตอนปิด) -->
          <svg class="w-4 h-4 text-white opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </div>
        <!-- ปุ่มวงกลมเลื่อน -->
        <span class="absolute left-1 top-1 bg-white w-7 h-7 rounded-full shadow-md transition-transform duration-200 peer-checked:translate-x-7 flex items-center justify-center">
          <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path>
          </svg>
        </span>
      </label>
    </div>
  </div>

  <!-- พื้นที่แสดงรายการพัสดุที่สแกนแล้ว -->
  <main class="flex-1 px-3 py-2.5 overflow-y-auto pb-24">
    <div id="emptyState" class="flex flex-col items-center justify-center py-12 text-center text-slate-400">
      <div class="bg-slate-200/70 p-4 rounded-full mb-3">
        <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
        </svg>
      </div>
      <p class="font-bold text-slate-500 text-base">ยังไม่มีรายการพัสดุ</p>
      <p class="text-xs text-slate-400 mt-1">กดปุ่มสแกนด้านข้างเครื่องเพื่อยิง</p>
    </div>

    <ul id="scannedList" class="space-y-2"></ul>
  </main>

  <!-- แถบปุ่มควบคุมด้านล่าง (ติดขอบล่างตลอดเวลา) -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-3 py-2.5 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
    <div class="grid grid-cols-3 gap-2.5">
      <button 
        type="button" 
        id="clearBtn" 
        class="col-span-1 bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-800 font-bold py-3.5 rounded-xl text-base transition flex items-center justify-center">
        ล้างค่า
      </button>
      <button 
        type="button" 
        id="saveBtn" 
        class="col-span-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3.5 rounded-xl text-base shadow-md transition flex items-center justify-center space-x-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
        </svg>
        <span>บันทึก (0)</span>
      </button>
    </div>
  </footer>

  <!-- Toast แจ้งเตือน -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-2xl shadow-xl text-sm font-bold z-50 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none bg-slate-800 text-white whitespace-nowrap">
    <span id="toastMessage">แจ้งเตือน</span>
  </div>

  <!-- Modal ยืนยันการล้างรายการทั้งหมด -->
  <div id="confirmModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-2xl text-center">
      <h3 class="text-lg font-bold text-slate-800">ยืนยันการล้างรายการทั้งหมด?</h3>
      <p class="text-sm text-slate-500 mt-1.5">รายการที่สแกนค้างไว้จะถูกลบทั้งหมด</p>
      <div class="grid grid-cols-2 gap-3 mt-5">
        <button id="cancelClearBtn" type="button" class="py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-base transition">ยกเลิก</button>
        <button id="confirmClearBtn" type="button" class="py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-base transition">ลบทิ้งเลย</button>
      </div>
    </div>
  </div>

  <!-- Modal ยืนยันการลบทีละรายการ -->
  <div id="confirmItemModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-2xl text-center">
      <h3 class="text-lg font-bold text-slate-800">ยืนยันการลบรายการนี้?</h3>
      <p class="text-sm text-slate-500 mt-1.5">รายการพัสดุดังกล่าวจะถูกลบออกจากตาราง</p>
      <div class="grid grid-cols-2 gap-3 mt-5">
        <button id="cancelItemBtn" type="button" class="py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-base transition">ยกเลิก</button>
        <button id="confirmItemBtn" type="button" class="py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-base transition">ลบรายการ</button>
      </div>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzzlww8AXROufhrEu9d4zLjA_a98Bx5_SWFtKpU1R96Shh3H_xsaO4nYl7-ADHccXgJ/exec';
    const STORAGE_KEY = 'idata_k3s_scanned_items';
    
    // โหลดข้อมูลเก่าที่เคยสแกนค้างไว้จากหน่วยความจำเครื่อง
    let scannedItems = [];
    try {
      const savedData = localStorage.getItem(STORAGE_KEY);
      if (savedData) {
        scannedItems = JSON.parse(savedData);
      }
    } catch (e) {
      scannedItems = [];
    }

    // ฟังก์ชันบันทึกรายการปัจจุบันลงหน่วยความจำเครื่อง
    function saveToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(scannedItems));
      } catch (e) {}
    }

    const barcodeInput = document.getElementById('barcodeInput');
    const scannedList = document.getElementById('scannedList');
    const emptyState = document.getElementById('emptyState');
    const itemCount = document.getElementById('itemCount');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    const preventDuplicate = document.getElementById('preventDuplicate');
    const soundEnabled = document.getElementById('soundEnabled');
    const keyboardToggle = document.getElementById('keyboardToggle');
    
    const confirmModal = document.getElementById('confirmModal');
    const cancelClearBtn = document.getElementById('cancelClearBtn');
    const confirmClearBtn = document.getElementById('confirmClearBtn');
    
    const confirmItemModal = document.getElementById('confirmItemModal');
    const cancelItemBtn = document.getElementById('cancelItemBtn');
    const confirmItemBtn = document.getElementById('confirmItemBtn');

    let isKeyboardOpen = false;

    // ฟังก์ชันเปิด/ปิดคีย์บอร์ดแบบสวิตช์เลื่อน
    if (keyboardToggle && barcodeInput) {
      keyboardToggle.addEventListener('change', () => {
        isKeyboardOpen = keyboardToggle.checked;
        if (isKeyboardOpen) {
          barcodeInput.removeAttribute('inputmode');
          showToast('เปิดคีย์บอร์ดแล้ว (พิมพ์เองได้)', 'bg-emerald-600 text-white');
        } else {
          barcodeInput.setAttribute('inputmode', 'none');
          showToast('ปิดคีย์บอร์ดแล้ว (พร้อมยิงสแกน)', 'bg-slate-800 text-white');
        }
        barcodeInput.blur();
        setTimeout(() => barcodeInput.focus(), 50);
      });
    }

    // ฟังก์ชันเล่นเสียงปี๊บสแกน (ใช้ AudioContext ตัวเดียวร่วมกัน ป้องกันเบราว์เซอร์บล็อกเสียงเมื่อยิงครบ 15-20 ครั้ง)
    let sharedAudioCtx = null;
    function getAudioContext() {
      if (!sharedAudioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          sharedAudioCtx = new AudioContextClass();
        }
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    }

    function playBeep() {
      if (!soundEnabled || !soundEnabled.checked) return;
      setTimeout(() => {
        try {
          const audioCtx = getAudioContext();
          if (!audioCtx) return;

          const now = audioCtx.currentTime;
          // เล่นเสียงทำนองสำเร็จ 2 โน้ตไล่เสียงสูงขึ้น (ติ๊ง-ด่อง! C6 -> G6)
          const notes = [
            { freq: 1046.50, time: 0, duration: 0.10 },    // โน้ตแรก (โดสูง)
            { freq: 1567.98, time: 0.11, duration: 0.22 }  // โน้ตสอง (ซอลสูง ลากยาวนิดหน่อยให้รู้สึกสำเร็จ)
          ];

          notes.forEach(note => {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'triangle'; // โทนเสียงใส กังวาน ฟังสบายหูแต่ดังชัด
            osc.frequency.setValueAtTime(note.freq, now + note.time);

            // ปรับระดับเสียงให้ดังชัดเจนและค่อยๆ เฟดลงตอนท้ายไม่ให้เสียงแตก
            gainNode.gain.setValueAtTime(1.0, now + note.time);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + note.time + note.duration);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(now + note.time);
            osc.stop(now + note.time + note.duration);
          });
        } catch (e) {}
      }, 400);
    }

    // ฟังก์ชันเล่นเสียงเตือนกรณีสแกนเลขซ้ำ (โทนต่ำ 2 จังหวะ ตื๊ด-ตื๊ด) หน่วงเวลา 0.4 วินาที
    function playDuplicateBeep() {
      if (!soundEnabled || !soundEnabled.checked) return;
      setTimeout(() => {
        try {
          const audioCtx = getAudioContext();
          if (!audioCtx) return;

          const now = audioCtx.currentTime;
          // เล่นเสียงโทนต่ำ 2 ครั้งติดกันเพื่อเตือนว่าเลขซ้ำ
          [0, 0.18].forEach((offset) => {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, now + offset);

            gainNode.gain.setValueAtTime(1.0, now + offset);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(now + offset);
            osc.stop(now + offset + 0.13);
          });
        } catch (e) {}
      }, 400);
    }

    // ปลุกระบบเสียงทันทีที่มีการแตะหน้าจอครั้งแรก
    document.addEventListener('touchstart', getAudioContext, { once: true });
    document.addEventListener('click', getAudioContext, { once: true });

    // แสดง Toast แจ้งเตือน
    function showToast(message, bgColor = 'bg-slate-800 text-white') {
      if (!toast || !toastMessage) return;
      toastMessage.textContent = message;
      toast.className = `fixed bottom-20 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-2xl shadow-xl text-sm font-bold z-50 transition-all duration-300 pointer-events-none whitespace-nowrap ${bgColor}`;
      toast.classList.remove('opacity-0', 'translate-y-4');
      
      clearTimeout(toast.hideTimeout);
      toast.hideTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2000);
    }

    // จัดการโฟกัสช่องสแกน (ป้องกันคีย์บอร์ดเด้งเมื่อไม่ได้เปิดโหมดพิมพ์เอง)
    function keepFocus() {
      if (!barcodeInput) return;
      if (!isKeyboardOpen) {
        barcodeInput.setAttribute('inputmode', 'none');
        barcodeInput.focus();
      } else {
        barcodeInput.removeAttribute('inputmode');
        barcodeInput.focus();
      }
    }

    // ดักจับสัญญาณยิงบาร์โค้ดจากปุ่มด้านข้างเครื่องโดยตรง (ทำงานได้แม้ช่องกรอกจะโดนซ่อนคีย์บอร์ด)
    let hardwareBuffer = '';
    let hardwareTimer = null;
    document.addEventListener('keydown', (e) => {
      // หากไม่ได้กำลังพิมพ์ในช่อง input หรือช่อง input รับค่าไม่ได้ ให้ดักจับค่าจากหัวอ่านเลเซอร์โดยตรง
      if (document.activeElement !== barcodeInput) {
        if (e.key === 'Enter') {
          if (hardwareBuffer.trim().length > 0) {
            e.preventDefault();
            addBarcode(hardwareBuffer.trim());
            hardwareBuffer = '';
            keepFocus();
          }
        } else if (e.key.length === 1) {
          hardwareBuffer += e.key;
          clearTimeout(hardwareTimer);
          hardwareTimer = setTimeout(() => {
            if (hardwareBuffer.trim().length >= 4) {
              addBarcode(hardwareBuffer.trim());
            }
            hardwareBuffer = '';
          }, 150);
        }
      }
    });

    if (barcodeInput) {
      barcodeInput.addEventListener('blur', () => {
        setTimeout(keepFocus, 150);
      });

      // รองรับการกด Enter ปกติ
      barcodeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = barcodeInput.value.trim();
          if (val) {
            addBarcode(val);
            barcodeInput.value = '';
          }
        }
      });

      // เพิ่มระบบดึงค่าอัตโนมัติทันทีเมื่อหัวอ่านยิงข้อมูลเสร็จ (รองรับเครื่องที่ส่งค่าต่อเนื่องโดยไม่มี Enter)
      let scanTimeout = null;
      barcodeInput.addEventListener('input', (e) => {
        const val = barcodeInput.value.trim();
        // หากมีความยาวตัวอักษรบาร์โค้ดทั่วไป (เช่น มากกว่า 5 ตัวอักษร) และมีค่าเข้ามา
        if (val.length >= 4) {
          clearTimeout(scanTimeout);
          scanTimeout = setTimeout(() => {
            const currentVal = barcodeInput.value.trim();
            if (currentVal) {
              addBarcode(currentVal);
              barcodeInput.value = '';
            }
          }, 120); // หน่วงเวลาเล็กน้อยรอให้หัวอ่านยิงตัวอักษรจนครบชุด
        }
      });
    }

    // เพิ่มบาร์โค้ดลงรายการ
    function addBarcode(code) {
      if (preventDuplicate && preventDuplicate.checked) {
        const exists = scannedItems.some(item => item.code === code);
        if (exists) {
          showToast('เลขพัสดุนี้มีในรายการแล้ว (กันซ้ำ)', 'bg-amber-500 text-white');
          playDuplicateBeep();
          return;
        }
      }

      const now = new Date();
      const timeString = now.toTimeString().split(' ')[0];
      
      scannedItems.unshift({ code, time: timeString });
      saveToLocalStorage(); // บันทึกลงเครื่องทันที
      playBeep();
      renderList();
      showToast('สแกนสำเร็จ: ' + code, 'bg-emerald-600 text-white');
    }

    // อัปเดตการแสดงผลรายการ
    function renderList() {
      const total = scannedItems.length;
      if (itemCount) itemCount.textContent = total;
      if (saveBtn) saveBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg><span>บันทึก (${total})</span>`;

      if (total === 0) {
        if (emptyState) emptyState.classList.remove('hidden');
        if (scannedList) scannedList.innerHTML = '';
        return;
      }

      if (emptyState) emptyState.classList.add('hidden');
      if (scannedList) {
        scannedList.innerHTML = scannedItems.map((item, index) => {
          const orderNumber = total - index;
          return `
            <li class="bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div class="flex items-center space-x-2.5 overflow-hidden">
                <span class="bg-blue-100 text-blue-700 font-extrabold text-sm w-8 h-8 rounded-lg flex items-center justify-center shrink-0">
                  ${orderNumber}
                </span>
                <div class="truncate">
                  <p class="font-bold text-slate-900 text-base leading-tight truncate select-all">${escapeHtml(item.code)}</p>
                  <p class="text-xs text-slate-500 leading-tight mt-0.5">${item.time}</p>
                </div>
              </div>
              <button 
                type="button" 
                onclick="promptRemoveItem(${index})" 
                class="text-rose-600 bg-rose-50 hover:bg-rose-100 active:bg-rose-200 p-2 rounded-xl transition shrink-0 ml-2"
                title="ลบรายการนี้">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </li>
          `;
        }).join('');
      }
    }

    let itemToDeleteIndex = null;

    window.promptRemoveItem = function(index) {
      itemToDeleteIndex = index;
      if (confirmItemModal) {
        confirmItemModal.classList.remove('hidden');
        confirmItemModal.classList.add('flex');
      }
    };

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // ปุ่มล้างค่าทั้งหมด
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (scannedItems.length === 0) return;
        if (confirmModal) {
          confirmModal.classList.remove('hidden');
          confirmModal.classList.add('flex');
        }
      });
    }

    if (cancelClearBtn) {
      cancelClearBtn.addEventListener('click', () => {
        if (confirmModal) {
          confirmModal.classList.add('hidden');
          confirmModal.classList.remove('flex');
        }
        keepFocus();
      });
    }

    if (confirmClearBtn) {
      confirmClearBtn.addEventListener('click', () => {
        scannedItems = [];
        saveToLocalStorage(); // ล้างข้อมูลในเครื่องด้วย
        renderList();
        if (confirmModal) {
          confirmModal.classList.add('hidden');
          confirmModal.classList.remove('flex');
        }
        showToast('ล้างรายการทั้งหมดแล้ว', 'bg-slate-700 text-white');
        keepFocus();
      });
    }

    // Event สำหรับ Modal ลบทีละรายการ
    if (cancelItemBtn) {
      cancelItemBtn.addEventListener('click', () => {
        if (confirmItemModal) {
          confirmItemModal.classList.add('hidden');
          confirmItemModal.classList.remove('flex');
        }
        itemToDeleteIndex = null;
        keepFocus();
      });
    }

    if (confirmItemBtn) {
      confirmItemBtn.addEventListener('click', () => {
        if (itemToDeleteIndex !== null && itemToDeleteIndex >= 0 && itemToDeleteIndex < scannedItems.length) {
          scannedItems.splice(itemToDeleteIndex, 1);
          saveToLocalStorage(); // อัปเดตข้อมูลในเครื่องหลังลบ
          renderList();
          showToast('ลบรายการพัสดุเรียบร้อยแล้ว', 'bg-slate-700 text-white');
        }
        if (confirmItemModal) {
          confirmItemModal.classList.add('hidden');
          confirmItemModal.classList.remove('flex');
        }
        itemToDeleteIndex = null;
        keepFocus();
      });
    }

    // ปุ่มบันทึกลง Google Sheets
    if (saveBtn) {
      saveBtn.addEventListener('click', async () => {
        if (scannedItems.length === 0) {
          showToast('ยังไม่มีรายการพัสดุที่สแกน', 'bg-amber-500 text-white');
          return;
        }

        const originalHTML = saveBtn.innerHTML;
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span>กำลังบันทึก...</span>';
        showToast('กำลังส่งข้อมูลไป Google Sheets...', 'bg-blue-600 text-white');

        try {
          const payload = {
            items: scannedItems.map(item => item.code)
          };

          await fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          showToast('บันทึกลงชีตสำเร็จ!', 'bg-emerald-600 text-white');
          scannedItems = [];
          saveToLocalStorage(); // ล้างข้อมูลในเครื่องเมื่อส่งเข้าชีตสำเร็จแล้ว
          renderList();
        } catch (error) {
          showToast('เกิดข้อผิดพลาดในการบันทึก', 'bg-rose-600 text-white');
        } finally {
          saveBtn.disabled = false;
          saveBtn.innerHTML = originalHTML;
          keepFocus();
        }
      });
    }

    window.addEventListener('load', () => {
      renderList(); // แสดงรายการเก่าที่ค้างอยู่ในเครื่องทันทีที่เปิดเว็บ
      keepFocus();
    });
  </script>
</body>
</html>
